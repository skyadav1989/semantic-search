
[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="semantic-engine"
version="0.1.0"
description="Semantic Search & Recommendation Engine"
requires-python=">=3.11"
dependencies=[
 "PyYAML>=6",
 "sentence-transformers",
 "qdrant-client",
 "fastapi",
 "uvicorn",
 "pydantic",
 "python-dotenv"
]


